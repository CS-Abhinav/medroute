<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedRoute – Order status</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="topbar"></header>
<div class="page">
  <div class="row" style="margin-bottom:1rem">
    <a href="/customer.html" class="btn sm">← Back to shop</a>
    <h2 style="margin:0 0 0 .5rem" id="orderTitle">Order</h2>
    <span id="orderStatus"></span>
  </div>
  <div class="order-grid">
    <div class="list">
      <div class="card" id="stageCard"></div>
      <div class="card">
        <h3>Progress</h3>
        <ul class="timeline" id="timeline"></ul>
      </div>
      <div class="card">
        <h3>Order details</h3>
        <div id="details"></div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;min-height:520px;position:relative">
      <div id="map" class="map" style="min-height:520px"></div>
    </div>
  </div>
</div>
<input type="file" id="reFile" accept="application/pdf,image/jpeg,image/png" hidden>

<script src="/lib/leaflet/leaflet.js"></script>
<script src="/lib/tesseract/tesseract.min.js"></script>
<script src="/lib/pdfjs/pdf.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/prescription.js"></script>
<script src="/js/order.js"></script>
</body>
</html>
