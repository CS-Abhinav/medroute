<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedRoute – Pharmacist review</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="topbar"></header>
<div class="app" style="grid-template-columns:380px 1fr">
  <aside class="sidebar">
    <div class="tabs">
      <button data-tab="pending" class="active">Pending <span class="count hidden" id="pendingCount">0</span></button>
      <button data-tab="recent">Recent decisions</button>
    </div>
    <div class="section"><div class="list" id="queue"></div></div>
  </aside>
  <main style="overflow-y:auto;padding:1rem">
    <div id="detail" class="muted" style="padding:2rem;text-align:center">Select a prescription from the queue to review it.</div>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/pharmacist.js"></script>

</body>
</html>
